<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 880" role="img" aria-labelledby="planB-title planB-desc">
<title id="planB-title">Floor Plan B — two bedrooms, two baths, 881 square feet</title>
<desc id="planB-desc">A split-bedroom layout. The living room, 13 feet by 15 feet 4 inches, sits at the centre with a bedroom and full bath at either end. Kitchen and dining run along the top, and a patio of 10 feet 3 inches by 7 feet 4 inches opens off the living room.</desc>

<style>
  .rm   { fill:#FBF8F2; }
  .rm-a { fill:#EFE8DC; }
  .rm-o { fill:#E4DCCD; }
  .w-o  { fill:none; stroke:#241C15; stroke-width:6; stroke-linejoin:miter; }
  .w-i  { fill:none; stroke:#241C15; stroke-width:3; stroke-linejoin:miter; }
  .fx   { fill:none; stroke:#241C15; stroke-width:1.6; }
  .sw   { fill:none; stroke:#B5A996; stroke-width:1.3; }
  .nm   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:650; font-size:14px;
          fill:#241C15; letter-spacing:.02em; text-anchor:middle; }
  .dm   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:400; font-size:12.5px;
          fill:#57493D; text-anchor:middle; }
  .sm   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:500; font-size:11px;
          fill:#8A7A6C; text-anchor:middle; }
  .ttl  { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:750; font-size:26px;
          fill:#241C15; letter-spacing:-.01em; }
  .sub  { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:400; font-size:14px;
          fill:#57493D; }
  .sq   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:750; font-size:26px;
          fill:#B0613A; text-anchor:end; }
</style>

