<line class="w-i" x1="110" y1="308" x2="658" y2="308"/>
<polyline class="w-i" points="378,308 378,482 427,532 427,636"/>
<polyline class="w-i" points="110,537 216,537 216,636"/>

<!-- door openings punched back in -->
<line stroke="#FBF8F2" stroke-width="5" x1="336" y1="308" x2="372" y2="308"/>
<line stroke="#FBF8F2" stroke-width="5" x1="176" y1="308" x2="212" y2="308"/>
<line stroke="#EFE8DC" stroke-width="5" x1="561" y1="231" x2="597" y2="231"/>
<line stroke="#FBF8F2" stroke-width="5" x1="452" y1="308" x2="488" y2="308"/>
<line stroke="#EFE8DC" stroke-width="5" x1="146" y1="537" x2="182" y2="537"/>
<line stroke="#E4DCCD" stroke-width="5" x1="250" y1="636" x2="303" y2="636"/>

<!-- door swings -->
<path class="sw" d="M372,308 A36,36 0 0 1 336,344"/>
<path class="sw" d="M488,308 A36,36 0 0 0 452,344"/>
<path class="sw" d="M597,231 A36,36 0 0 1 561,267"/>
<path class="sw" d="M212,308 A36,36 0 0 0 176,344"/>

