<text class="dm" x="276" y="729">5'6" &#215; 7'4"</text>

<!-- ── title block ────────────────────────────────────── -->
<line x1="55" y1="838" x2="665" y2="838" stroke="#C0B8A4" stroke-width="1.5"/>
<text class="ttl" x="55" y="868">Plan A</text>
<text class="sub" x="55" y="888">One bedroom, one bath</text>
<text class="sq"  x="665" y="868">633 sq ft</text>
