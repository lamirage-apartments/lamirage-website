<!-- closet rod -->
<line class="fx" x1="527" y1="270" x2="646" y2="270"/>

<!-- ── labels ─────────────────────────────────────────── -->
<text class="nm" x="160" y="140">Kitchen</text>

<text class="nm" x="352" y="145">Dining</text>
<text class="dm" x="352" y="164">8'0" &#215; 8'9"</text>

<text class="nm" x="586" y="180">Bath</text>

<text class="sm" x="586" y="275">Closet</text>

<text class="sm" x="172" y="276">Entry</text>

<text class="nm" x="518" y="414">Bedroom</text>
<text class="dm" x="518" y="433">12'9" &#215; 10'2"</text>

<text class="nm" x="248" y="468">Living Room</text>
<text class="dm" x="248" y="487">12'2" &#215; 14'11"</text>

<text class="sm" x="163" y="592">Storage</text>

