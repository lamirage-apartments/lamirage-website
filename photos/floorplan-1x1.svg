<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="planA-title planA-desc">
<title id="planA-title">Floor Plan A — one bedroom, one bath, 633 square feet</title>
<desc id="planA-desc">Entry opens into a living room of 12 feet 2 inches by 14 feet 11 inches, with a private patio off the living room. The kitchen and dining area sit along the top of the plan, with a bedroom of 12 feet 9 inches by 10 feet 2 inches and a full bath to the right.</desc>

<style>
  .rm   { fill:#FBF8F2; }
  .rm-a { fill:#EFE8DC; }
  .rm-o { fill:#E4DCCD; }
  .w-o  { fill:none; stroke:#241C15; stroke-width:6; stroke-linejoin:miter; }
  .w-i  { fill:none; stroke:#241C15; stroke-width:3; stroke-linejoin:miter; }
  .w-d  { fill:none; stroke:#241C15; stroke-width:6; stroke-dasharray:2 7; stroke-linecap:round; }
  .fx   { fill:none; stroke:#241C15; stroke-width:1.6; }
  .sw   { fill:none; stroke:#B5A996; stroke-width:1.3; }
  .nm   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:650; font-size:14px;
          fill:#241C15; letter-spacing:.02em; text-anchor:middle; }
  .dm   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:400; font-size:12.5px;
          fill:#57493D; text-anchor:middle; }
  .sm   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:500; font-size:11px;
          fill:#8A7A6C; text-anchor:middle; }
  .ttl  { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:750; font-size:26px;
          fill:#241C15; letter-spacing:-.01em; }
  .sub  { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:400; font-size:14px;
          fill:#57493D; }
  .sq   { font-family:'Instrument Sans',system-ui,sans-serif; font-weight:750; font-size:26px;
          fill:#B0613A; text-anchor:end; }
</style>

<!-- ── room fills ─────────────────────────────────────── -->
<polygon class="rm-a" points="55,55 264,55 264,231 55,231"/>
<polygon class="rm"   points="264,55 440,55 440,247 264,247"/>
<polygon class="rm-a" points="515,55 658,55 658,231 515,231"/>
<polygon class="rm-a" points="515,231 658,231 658,308 515,308"/>
<polygon class="rm"   points="55,231 264,231 264,308 110,308 55,235"/>
<polygon class="rm"   points="264,247 515,247 515,308 264,308"/>
<polygon class="rm"   points="378,308 658,308 658,532 427,532 378,482"/>
<polygon class="rm"   points="110,308 378,308 378,482 427,532 427,636 110,636"/>
<polygon class="rm-a" points="110,537 216,537 216,636 110,636"/>
<polygon class="rm-o" points="216,636 337,636 337,797 216,797"/>

<!-- ── outer envelope ─────────────────────────────────── -->
<polygon class="w-o" points="55,55 658,55 658,532 427,532 427,636 110,636 110,308 55,235"/>
<polyline class="w-o" points="216,636 216,797 337,797 337,636"/>

<!-- ── interior walls ─────────────────────────────────── -->
<line class="w-i" x1="264" y1="55"  x2="264" y2="231"/>
<line class="w-i" x1="55"  y1="231" x2="264" y2="231"/>
<line class="w-i" x1="440" y1="55"  x2="440" y2="247"/>
<line class="w-i" x1="264" y1="247" x2="515" y2="247"/>
